spring:
  application:
    name: discodeit

  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      # PostgreSQL 환경이면 MySQL8Dialect 대신 PostgreSQLDialect 설정
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    # open-in-view를 false로 할 수도 있음 (OSIV 비활성화)
    # open-in-view: false


logging:
  level:
    org.hibernate.SQL: DEBUG  # SQL 실행 로그 출력
    org.hibernate.orm.jdbc.bind: TRACE  # SQL 바인딩된 파라미터 값도 출력

  sql:
    init:
      mode: never

  servlet:
    multipart:
      maxFileSize: 10MB
      maxRequestSize: 30MB

discodeit:
  storage:
    type: local
    local:
      root-path: "C:/myproject/files"
